# The user of rspamd. rspamd 4.3.0 of rspamd.com (el9) no longer creates it in its package (empty %pre): on a new host its
# service failed and the setup of eFa-next with it. Where the user is there already, systemd-sysusers changes nothing.
g _rspamd -
u _rspamd - "rspamd" /var/lib/rspamd /sbin/nologin
