# The admin web interface without sudo (efactl only through efactl-runner): a web process taken over gets no new rights,
# writes nowhere outside its private /tmp and cannot read the private keys of the host. It reads its settings in /etc/eFa and
# /etc/efa-web, the exports and logos under /var/lib, and the load figures in /proc and /sys; the free space of /home, /var/log
# and /var/lib/mysql (statvfs), so those stay visible.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
UMask=0077
InaccessiblePaths=-/etc/ssh -/etc/pki/tls/private -/etc/sudoers.d -/etc/rspamd/dkim -/etc/letsencrypt -/etc/postfix/sasl -/var/spool/postfix
