# A2: lockdown for the eFa-next services that handle untrusted mail. They only parse data and talk over sockets; they run no
# privileged OS tools (no sudo, no efactl), so these limits do not change what they may do. The root orchestrators
# (efactl-runner, efa-portal-helper, efa-init, efa-cluster and the efactl timers) are deliberately not confined this way.
[Service]
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
