# G7-6: efactl geoip-run downloads from the internet (only while GeoIP is on). It stays root, because its setting file lies in
# /etc/eFa among files of root, but without any capability and with a read-only system: it may write only the GeoIP files
# (StateDirectory), its setting file in /etc/eFa (written beside it, then renamed), the audit log and the state lock in /run.
[Service]
StateDirectory=eFa/geoip
StateDirectoryMode=0755
ProtectSystem=strict
ReadWritePaths=/etc/eFa /var/log/eFa /run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryMax=256M
TimeoutStartSec=900
