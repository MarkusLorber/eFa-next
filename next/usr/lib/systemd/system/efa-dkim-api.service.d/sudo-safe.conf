# 5v (h): only limits that work through mount namespaces. This unit has a user of its own and starts a program through sudo;
# systemd sets NoNewPrivileges for such a unit as soon as it gets a system call filter of any kind (ProtectKernelModules,
# ProtectKernelLogs, ProtectClock, ProtectHostname, RestrictNamespaces, RestrictRealtime, LockPersonality,
# SystemCallArchitectures, RestrictAddressFamilies ...), and sudo then cannot gain root.
# The full sandbox follows once the provisioning API reaches efactl through efactl-runner instead of sudo.
[Service]
ProtectKernelTunables=yes
ProtectControlGroups=yes
