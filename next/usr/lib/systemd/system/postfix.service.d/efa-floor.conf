# eFa-next: before each start the security minimum; a setting under the limit that cannot be set back refuses the start (fail closed).
[Service]
# "+": the check runs outside a sandbox of the service (it writes the audit log and may put the TLS settings back).
ExecStartPre=+/usr/sbin/efactl floor-check --mode prestart --service postfix
